name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: npm
      # OIDC trusted publishing requires npm >= 11.5.1; node 20 ships npm 10.x.
      # Pin to npm 11 (not @latest): npm 12+ requires Node >= 22, which would
      # fail this Node-20 job. npm 11.x supports OIDC and runs on Node 20.17+.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Skip if version already on npm
        id: npm_check
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "bumpsight@$version" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::bumpsight@$version already on npm — skipping publish (re-run safe)"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm_check.outputs.already_published != 'true'
        # Publishes via GitHub OIDC trusted publishing (configured on the npm
        # package): no NPM_TOKEN needed, and provenance is generated automatically.
        run: npm publish --access public

  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/miller-joe/bumpsight
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHCR-backed registry cache (replaces the GHA cache backend, which
          # consistently hung on multi-arch cache export during v0.2.1 builds).
          cache-from: type=registry,ref=ghcr.io/miller-joe/bumpsight:buildcache
          cache-to: type=registry,ref=ghcr.io/miller-joe/bumpsight:buildcache,mode=max

  publish-release:
    # Create the GitHub Release page with the CHANGELOG section for this
    # tag as the body. Runs after npm + GHCR succeed so a failed publish
    # doesn't leave a stub release pointing at nothing. Pre-v0.4.3 this
    # was a manual step.
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-image]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract CHANGELOG section for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ ("^## "v"( |$)") { flag=1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "(No CHANGELOG entry for $version — see CHANGELOG.md.)" > release-body.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
